<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Itzell 🎃</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->
    <header class="hero">

        <div class="pumpkin">
            🎃
        </div>

        <h1>
            Halloween Night
        </h1>

        <p>
            Can't wait to spend Halloween with you Bae ❤️
        </p>

    </header>


    <!-- MUSIC -->
    <section class="music-player">

        <p class="music-title">
            🎵 Halloween Music
        </p>

        <audio controls loop>

            <source
                src="Michael Myers Theme Song.mp3"
                type="audio/mpeg"
            >

            Your browser does not support the audio element.

        </audio>

    </section>


    <!-- MOVIE MESSAGE -->
    <section class="movie-section">

        <h2>
            🎬 Pick Our Movie
        </h2>

        <p>
            Click a picture to watch Netflix ❤️
        </p>

    </section>


    <!-- IMAGE GALLERY -->
    <div class="container">

        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="hellokitty.png"
                alt="Hello Kitty Halloween"
            >

            <span>
                Hello Kitty 🎀
            </span>

        </a>


        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="Scream-PNG-Pic.png"
                alt="Ghostface"
            >

            <span>
                Scream 🔪
            </span>

        </a>


        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="chucky.png"
                alt="Chucky"
            >

            <span>
                Chucky 🧸
            </span>

        </a>


        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="jason.png"
                alt="Jason Voorhees"
            >

            <span>
                Jason 🔪
            </span>

        </a>


        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="halloween.png"
                alt="Halloween"
            >

            <span>
                Halloween 🎃
            </span>

        </a>

    </div>


    <!-- NETFLIX BUTTON -->
    <div class="netflix-section">

        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="netflix-button"
        >
            🎬 Open Netflix
        </a>

    </div>


    <!-- FOOTER -->
    <footer>

        Made with ❤️ for Halloween 🎃

    </footer>

</body>

</html>
