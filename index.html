<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Itzell 🎃</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Halloween Music -->
    <div class="music-player">

        <audio controls loop>

            <source
                src="Michael Myers Theme Song.mp3"
                type="audio/mpeg"
            >

            Your browser does not support the audio element.

        </audio>

    </div>


    <!-- Message -->
    <h3 class="message">

        Can't wait to spend Halloween with you Bae ❤️🎃

    </h3>


    <!-- Netflix -->
    <a
        href="https://www.netflix.com/"
        target="_blank"
        rel="noopener noreferrer"
        class="netflix-link"
    >

        🎬 Watch Netflix

    </a>


    <!-- Halloween Gallery -->
    <div class="container">

        <img
            src="hellokitty.png"
            alt="Hello Kitty Halloween"
        >

        <img
            src="Scream-PNG-Pic.png"
            alt="Ghostface"
        >

        <img
            src="chucky.png"
            alt="Chucky"
        >

        <img
            src="jason.png"
            alt="Jason Voorhees"
        >

        <img
            src="halloween.png"
            alt="Halloween"
        >

    </div>

</body>

</html>
