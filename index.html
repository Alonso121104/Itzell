<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Itzell 🎃</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HERO -->
    <header class="hero">

        <div class="pumpkin">🎃</div>

        <h1>Halloween Night</h1>

        <p>
            Can't wait to spend Halloween with you Bae ❤️
        </p>

    </header>


    <!-- MOVIE SECTION -->
    <section class="movie-section">

        <h2>🎬 Pick Our Movie</h2>

        <p>
            Click any picture to open Netflix ❤️
        </p>

    </section>


    <!-- MOVIE CARDS -->
    <main class="container">

        <!-- HELLO KITTY -->
        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="hellokitty.png"
                alt="Hello Kitty Halloween"
            >

            <div class="card-overlay">
                <span>Hello Kitty 🎀</span>
                <small>Click to watch</small>
            </div>

        </a>


        <!-- SCREAM -->
        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="Scream-PNG-Pic.png"
                alt="Scream"
            >

            <div class="card-overlay">
                <span>Scream 🔪</span>
                <small>Click to watch</small>
            </div>

        </a>


        <!-- CHUCKY -->
        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="chucky.png"
                alt="Chucky"
            >

            <div class="card-overlay">
                <span>Chucky 🧸</span>
                <small>Click to watch</small>
            </div>

        </a>


        <!-- JASON -->
        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="jason.png"
                alt="Jason Voorhees"
            >

            <div class="card-overlay">
                <span>Jason 🔪</span>
                <small>Click to watch</small>
            </div>

        </a>


        <!-- HALLOWEEN -->
        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="movie-card"
        >

            <img
                src="halloween.png"
                alt="Halloween"
            >

            <div class="card-overlay">
                <span>Halloween 🎃</span>
                <small>Click to watch</small>
            </div>

        </a>

    </main>


    <!-- NETFLIX BUTTON -->
    <section class="netflix-section">

        <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="netflix-button"
        >
            🎬 Open Netflix
        </a>

    </section>


    <!-- FOOTER -->
    <footer>

        Made with ❤️ for Halloween 🎃

    </footer>

</body>

</html>
